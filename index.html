<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>电视盒子 · SoC 性能竞技场</title>
    <!-- 引入 ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js">
    </script>
    <style>
        /* ===== 全局科技暗色 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0b0f1a;
            font-family: 'Segoe UI', 'Poppins', system-ui, sans-serif;
            color: #c8dbe9;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 30px 20px;
        }

        .container {
            max-width: 1600px;
            width: 100%;
            background: rgba(12, 20, 35, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border-radius: 40px;
            padding: 32px 36px 40px;
            border: 1px solid rgba(0, 180, 255, 0.12);
            box-shadow: 0 20px 60px rgba(0, 20, 80, 0.6);
        }

        /* ===== 头部 ===== */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(0, 200, 255, 0.15);
            padding-bottom: 16px;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, #7eb8ff, #a78bfa, #6b8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: 1px;
            text-shadow: 0 0 30px rgba(80, 140, 255, 0.25);
        }

        /* ===== 表格容器 ===== */
        .table-wrap {
            overflow-x: auto;
            border-radius: 20px;
            background: rgba(8, 16, 30, 0.6);
            border: 1px solid rgba(0, 180, 255, 0.08);
            padding: 4px 0;
            margin-bottom: 32px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 1300px;
        }

        th {
            background: rgba(0, 160, 255, 0.08);
            color: #7eb8ff;
            font-weight: 500;
            padding: 14px 10px;
            text-align: center;
            border-bottom: 2px solid rgba(0, 180, 255, 0.15);
            letter-spacing: 0.5px;
            font-size: 12px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        td {
            padding: 12px 8px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            color: #c8d6e8;
            font-weight: 400;
            vertical-align: middle;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background: rgba(0, 160, 255, 0.06);
        }

        .model-name {
            font-weight: 600;
            color: #d6e8ff;
            white-space: nowrap;
        }

        .badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 500;
            background: rgba(0, 200, 255, 0.08);
            border: 1px solid rgba(0, 200, 255, 0.12);
            color: #8ccbff;
            white-space: nowrap;
        }

        .badge-tv {
            background: rgba(255, 180, 50, 0.12);
            border-color: rgba(255, 180, 50, 0.2);
            color: #f5b85b;
        }

        .badge-chip {
            background: rgba(100, 200, 255, 0.05);
            border-color: rgba(100, 200, 255, 0.08);
            color: #a0c8ff;
        }

        .score-highlight {
            color: #b0d4ff;
            font-weight: 500;
        }

        .missing {
            color: #546a7a;
            font-style: italic;
        }

        /* ===== 图表容器 ===== */
        .chart-box {
            background: rgba(8, 16, 30, 0.5);
            border-radius: 24px;
            border: 1px solid rgba(0, 180, 255, 0.08);
            padding: 16px 16px 8px;
            margin-top: 10px;
        }

        .chart-box .chart-title {
            font-size: 16px;
            font-weight: 500;
            color: #a0c8e8;
            letter-spacing: 1px;
            margin-bottom: 6px;
            padding-left: 6px;
        }

        .chart-container {
            width: 100%;
            height: 280px;
        }

        /* ===== 底部 ===== */
        .footer {
            margin-top: 30px;
            font-size: 13px;
            color: #3a5a7a;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            padding-top: 18px;
            letter-spacing: 0.5px;
        }

        .footer a {
            color: #7eb8ff;
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer a:hover {
            color: #a78bfa;
            text-decoration: underline;
        }

        .footer span {
            color: #5a7a9a;
        }

        /* ===== 响应式 ===== */
        @media (max-width: 1100px) {
            .container {
                padding: 20px 16px;
            }
            .header h1 {
                font-size: 24px;
            }
            th,
            td {
                font-size: 11px;
                padding: 8px 4px;
            }
            table {
                min-width: 1000px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 头部 -->
        <div class="header">
            <div>
                <h1>⚡ 电视盒子芯片性能PK</h1>
                <div style="height:2px;width:120px;background:linear-gradient(90deg,transparent,#4f8cff,#a78bfa,transparent);margin-top:4px;"></div>
            </div>
        </div>

        <!-- 表格 -->
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>名称</th>
                        <th>配置<br><span style="font-weight:300;font-size:10px;">(内存+硬盘)</span></th>
                        <th>芯片</th>
                        <th>总分</th>
                        <th>制程</th>
                        <th>CPU</th>
                        <th>核心</th>
                        <th>GPU<br><span style="font-weight:300;font-size:10px;">(跑分)</span></th>
                        <th>GPU名称</th>
                        <th>MEM</th>
                        <th>内存带宽<br><span style="font-weight:300;font-size:10px;">(G/s)</span></th>
                        <th>系统跑分</th>
                        <th>安卓</th>
                        <th>网口</th>
                        <th>Wi-Fi</th>
                        <th>USB</th>
                    </tr>
                </thead>
                <tbody id="socTableBody">
                    <!-- JS 渲染 -->
                </tbody>
            </table>
        </div>

        <!-- CPU & GPU & 总分 对比图 -->
        <div class="chart-box">
            <div class="chart-title">📊 性能三围：总分 · CPU · GPU</div>
            <div id="chartCpuGpu" class="chart-container"></div>
        </div>

        <div class="footer">
            <span>该数据来源于B站数码区UP主 <a href="https://space.bilibili.com/390423616/lists/7672860?type=season" target="_blank">当时只道是-寻常-</a>。</span>
        </div>
    </div>

    <script>
        // ==================== 数据（GPU名称已全部补全） ====================
        const devices = [{
            name: '当贝H5（新）',
            config: '2+64',
            chip: '全志618',
            total: 91947,
            process: '28nm',
            cpu: 26430,
            cores: '4核A53',
            gpuScore: 17604,
            gpuName: 'Mali-G31 MP2',
            mem: 12689,
            bandwidth: 64,
            sys: 35224,
            android: '12',
            eth: '无',
            wifi: '双频WiFi5',
            usb: '2.0',
            isTv: false
        }, {
            name: '小米4s max',
            config: '4+64',
            chip: '晶晨S905X3',
            total: 113794,
            process: '12nm',
            cpu: 29986,
            cores: '4核A55',
            gpuScore: 23732,
            gpuName: 'Mali-G31 MP2',
            mem: 18080,
            bandwidth: 91,
            sys: 41996,
            android: '9',
            eth: '无',
            wifi: '双频WiFi5',
            usb: '2.0',
            isTv: false
        }, {
            name: '极光3pro',
            config: '4+32',
            chip: '晶晨S905X3',
            total: 119063,
            process: '12nm',
            cpu: 31096,
            cores: '4核A55',
            gpuScore: 26396,
            gpuName: 'Mali-G31 MP2',
            mem: 18333,
            bandwidth: 91,
            sys: 43238,
            android: '9',
            eth: '千兆',
            wifi: '双频WiFi5',
            usb: '2.0+3.0',
            isTv: false
        }, {
            name: '极光6se',
            config: '1+32',
            chip: '全志618',
            total: 76415,
            process: '28nm',
            cpu: 29077,
            cores: '4核A53',
            gpuScore: 10741,
            gpuName: 'Mali-G31 MP2',
            mem: 0,
            bandwidth: 65,
            sys: 36597,
            android: '10',
            eth: '百兆',
            wifi: '2.4G WiFi',
            usb: '2.0',
            isTv: false
        }, {
            name: '极光7air',
            config: '4+32',
            chip: '晶晨S905X5M',
            total: 186164,
            process: '6nm',
            cpu: 41955,
            cores: '4核A55',
            gpuScore: 50690,
            gpuName: 'Mali-G310 V2',
            mem: 42274,
            bandwidth: 225,
            sys: 51245,
            android: '14',
            eth: '百兆',
            wifi: '双频WiFi6',
            usb: '2.0+Type-C',
            isTv: false
        }, {
            name: '小米5',
            config: '2+32',
            chip: '晶晨S905X5M',
            total: 164288,
            process: '6nm',
            cpu: 40963,
            cores: '4核A55',
            gpuScore: 30706,
            gpuName: 'Mali-G310 V2',
            mem: 42968,
            bandwidth: 14,
            sys: 49651,
            android: '14',
            eth: '无',
            wifi: '双频WiFi6',
            usb: '2.0',
            isTv: false
        }, {
            name: '雷鸟鹏6',
            config: '3+64',
            chip: '晶晨TC8000',
            total: 133909,
            process: '12nm',
            cpu: 27591,
            cores: '5核A55',
            gpuScore: 24040,
            gpuName: 'Mali-G57',
            mem: 36756,
            bandwidth: 195,
            sys: 45522,
            android: '11',
            eth: '百兆',
            wifi: '双频WiFi5',
            usb: '2.0+3.0',
            isTv: true
        }];

        // ==================== 渲染表格 ====================
        const tbody = document.getElementById('socTableBody');
        devices.forEach(d => {
            const tr = document.createElement('tr');
            let nameHtml = `<span class="model-name">${d.name}</span>`;
            if (d.isTv) {
                nameHtml += ` <span class="badge badge-tv">电视</span>`;
            }
            const bandwidthVal = d.bandwidth !== null ? d.bandwidth : '—';
            const gpuNameVal = d.gpuName || '—';
            const memVal = d.mem !== null ? d.mem : '—';
            const sysVal = d.sys !== null ? d.sys : '—';
            tr.innerHTML = `
                <td>${nameHtml}</td>
                <td>${d.config}</td>
                <td><span class="badge badge-chip">${d.chip}</span></td>
                <td class="score-highlight">${d.total.toLocaleString()}</td>
                <td><span class="badge" style="background:rgba(0,200,255,0.04);border-color:rgba(0,200,255,0.08);">${d.process}</span></td>
                <td class="score-highlight">${d.cpu.toLocaleString()}</td>
                <td>${d.cores}</td>
                <td class="score-highlight">${d.gpuScore.toLocaleString()}</td>
                <td>${gpuNameVal}</td>
                <td class="score-highlight">${memVal.toLocaleString()}</td>
                <td>${bandwidthVal}</td>
                <td class="score-highlight">${sysVal.toLocaleString()}</td>
                <td><span class="badge">${d.android}</span></td>
                <td>${d.eth}</td>
                <td>${d.wifi}</td>
                <td>${d.usb}</td>
            `;
            tbody.appendChild(tr);
        });

        // ==================== 绘制 CPU & GPU & 总分 柱状图 ====================
        const chartDom = document.getElementById('chartCpuGpu');
        const myChart = echarts.init(chartDom);

        const models = devices.map(d => d.name);
        const cpuData = devices.map(d => d.cpu);
        const gpuData = devices.map(d => d.gpuScore);
        const totalData = devices.map(d => d.total);

        const option = {
            tooltip: {
                trigger: 'axis',
                axisPointer: { type: 'shadow' },
                formatter: function(params) {
                    let res = `<strong>${params[0].axisValue}</strong><br/>`;
                    params.forEach(p => {
                        res += `${p.marker} ${p.seriesName}：${p.value.toLocaleString()}<br/>`;
                    });
                    return res;
                }
            },
            legend: {
                data: ['总分', 'CPU', 'GPU'],
                textStyle: { color: '#b0cce0' },
                top: 0,
                right: 10
            },
            grid: {
                left: '6%',
                right: '4%',
                bottom: '15%',
                top: '18%',
                containLabel: true
            },
            xAxis: {
                type: 'category',
                data: models,
                axisLabel: {
                    color: '#8aa8d0',
                    fontSize: 11,
                    rotate: 20,
                    interval: 0
                },
                axisLine: { lineStyle: { color: '#2a3a5a' } },
            },
            yAxis: {
                type: 'value',
                splitLine: { lineStyle: { color: '#1a2a3a', type: 'dashed' } },
                axisLabel: { color: '#8aa8d0', fontSize: 11 },
                name: '跑分',
                nameTextStyle: { color: '#6a8aaa', fontSize: 12 }
            },
            series: [{
                name: '总分',
                type: 'bar',
                data: totalData,
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#f472b6' },
                        { offset: 1, color: '#be5a9a' }
                    ]),
                    borderRadius: [4, 4, 0, 0]
                },
                barWidth: '18%',
                barGap: '60%'
            }, {
                name: 'CPU',
                type: 'bar',
                data: cpuData,
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#6b8cff' },
                        { offset: 1, color: '#4f6bc0' }
                    ]),
                    borderRadius: [4, 4, 0, 0]
                },
                barWidth: '18%',
                barGap: '60%'
            }, {
                name: 'GPU',
                type: 'bar',
                data: gpuData,
                itemStyle: {
                    color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                        { offset: 0, color: '#a78bfa' },
                        { offset: 1, color: '#7c5cdb' }
                    ]),
                    borderRadius: [4, 4, 0, 0]
                },
                barWidth: '18%',
                barGap: '60%'
            }]
        };

        myChart.setOption(option);

        // 自适应
        window.addEventListener('resize', () => {
            myChart.resize();
        });
    </script>

</body>
</html>
